# Demo profiles offered on the entry screen (#107). Loaded by seed-demo-profiles.
#
# Agent names come from what agents say in ABCD conversations: ABCD v1.1 at
# commit 6b8700c, training split only. They are demo names, not verified
# identities, and two conversations with the same name may involve different
# people. "Carol" and "Carol Jensen" stay separate; "Betty" is an alias used in
# the conversation.
#
# Each `id` is the profile's permanent ID (stored as the user's and agent's
# external_id). Never change or reuse one; add new profiles with new IDs.
# `conversations` are original ABCD conversation IDs.

dataset = "ABCD"
split = "train"

[manager]
id = "demo-manager-01"
name = "Demo Manager"

