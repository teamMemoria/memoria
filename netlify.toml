# How Netlify builds and serves the frontend. See "Deploying" in frontend/README.md.
# VITE_DEMO_LOGIN and VITE_API_BASE_URL are set in the Netlify dashboard, not here.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app's router handles every path, so refreshing /agent/conversations
# must still load index.html. Real files in dist are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
